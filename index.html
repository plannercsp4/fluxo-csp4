<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Planeamento Produção CSP4</title>
<link rel="icon" href="corksupply-icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&family=Roboto+Slab:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{color-scheme:light;}
  :root{
    --bg:#F4F4F4; --surface:#FFFFFF; --surface-2:#ECEAE6; --ink:#302E2D; --ink-dim:#746F6D; --line:#D9D6D2;
    --accent:#467D3C; --accent-ink:#FFFFFF;
    --good:#467D3C; --good-bg:#E7F0E3; --warn:#B5790E; --warn-bg:#FBF0DA; --bad:#B23A2A; --bad-bg:#F8E4E0; --info:#3D6E8C; --info-bg:#E4EEF3;
    --shadow:0 1px 2px rgba(48,46,45,.07),0 4px 14px rgba(48,46,45,.08);
    --radius:10px;
    --font-display:'Roboto Slab',Georgia,serif; --font-body:'IBM Plex Sans',system-ui,sans-serif; --font-mono:'IBM Plex Mono',ui-monospace,monospace;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#1E1C1B; --surface:#282624; --surface-2:#302E2C; --ink:#EDEAE5; --ink-dim:#A79E96; --line:#46423F;
      --accent:#7FB56E; --accent-ink:#16240F;
      --good:#6FBE63; --good-bg:#17301A; --warn:#E0AE4C; --warn-bg:#3A2E10; --bad:#E2705F; --bad-bg:#3A1C17; --info:#7EB3D1; --info-bg:#122C38;
      --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 18px rgba(0,0,0,.35);
    }
  }
  :root[data-theme="dark"]{
    --bg:#1E1C1B; --surface:#282624; --surface-2:#302E2C; --ink:#EDEAE5; --ink-dim:#A79E96; --line:#46423F;
    --accent:#7FB56E; --accent-ink:#16240F;
    --good:#6FBE63; --good-bg:#17301A; --warn:#E0AE4C; --warn-bg:#3A2E10; --bad:#E2705F; --bad-bg:#3A1C17; --info:#7EB3D1; --info-bg:#122C38;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 18px rgba(0,0,0,.35);
  }

  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);padding-inline:16px;font-size:14px;}
  h1,h2,h3{font-family:var(--font-display);text-wrap:balance;margin:0;}
  button{font-family:inherit;}
  .mono{font-family:var(--font-mono);}
  ::selection{background:var(--accent);color:var(--accent-ink);}
  img{max-width:100%;}

  .app{max-width:1400px;margin:0 auto;padding-block:16px 40px;}

  /* ---------- topbar ---------- */
  .topbar{position:sticky;top:0;z-index:20;background:var(--bg);padding-block:10px;margin-bottom:14px;border-bottom:1px solid var(--line);}
  .topbar-row{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;}
  .brand{display:flex;align-items:center;gap:9px;margin-right:6px;}
  .brand-mark{width:26px;height:26px;display:block;}
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .brand-mark{filter:contrast(.83) brightness(1.7);} }
  :root[data-theme="dark"] .brand-mark{filter:contrast(.83) brightness(1.7);}
  .brand h1{font-size:17px;font-weight:700;white-space:nowrap;}
  .spacer{flex:1;}
  input[type="search"],input[type="text"],input[type="email"],input[type="password"],input[type="number"],input[type="date"],select,.field input,.field select,.field textarea{
    font-family:inherit;font-size:13px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 10px;
  }
  input[type="search"]{min-width:200px;}
  .btn{border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-weight:600;font-size:13px;padding:7px 14px;cursor:pointer;}
  .btn:hover{border-color:var(--ink-dim);}
  .btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent;border-radius:0 999px 999px 0;padding-inline:16px 18px;letter-spacing:.02em;}
  .btn.primary:hover{filter:brightness(1.06);}
  .btn.danger{color:var(--bad);}
  .btn.small{padding:4px 10px;font-size:12px;}
  .author{display:flex;align-items:center;gap:6px;color:var(--ink-dim);font-size:12px;}
  .author input{width:120px;padding:6px 8px;font-size:12px;}

  .banner{background:var(--warn-bg);color:var(--warn);border:1px solid color-mix(in srgb, var(--warn) 40%, transparent);border-radius:8px;padding:9px 14px;font-size:13px;margin-bottom:14px;display:flex;gap:10px;align-items:center;}

  /* ---------- department tabs ---------- */
  .dept-tabs{display:flex;flex-wrap:wrap;gap:4px;background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:3px;}
  .dept-tab{border:none;background:transparent;color:var(--ink-dim);padding:7px 14px;border-radius:999px;font-weight:600;font-size:12.5px;cursor:pointer;white-space:nowrap;}
  .dept-tab.active{background:var(--surface);color:var(--ink);box-shadow:var(--shadow);}

  /* ---------- board ---------- */
  .board-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,320px));gap:14px;}
  .board-empty{color:var(--ink-dim);font-size:13px;text-align:center;padding:60px 20px;grid-column:1/-1;}

  /* ---------- card ---------- */
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:12px 14px;cursor:pointer;display:flex;flex-direction:column;gap:6px;}
  .card:hover{border-color:var(--accent);}
  .card-title{font-weight:600;font-size:14px;line-height:1.3;}
  .card-sub{color:var(--ink-dim);font-size:12px;margin-top:-4px;}
  .card-rows{display:flex;flex-direction:column;gap:4px;margin-top:4px;border-top:1px solid var(--line);padding-top:8px;}
  .card-row{display:flex;justify-content:space-between;gap:10px;font-size:12px;}
  .card-row-label{color:var(--ink-dim);white-space:nowrap;}
  .card-row-value{color:var(--ink);font-weight:500;text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

  /* ---------- panel (edit) ---------- */
  .scrim{position:fixed;inset:0;background:rgba(20,16,10,.38);z-index:40;}
  .panel{position:fixed;top:0;right:0;height:100%;width:min(440px,100vw);background:var(--surface);z-index:41;box-shadow:-8px 0 24px rgba(0,0,0,.18);transform:translateX(100%);transition:transform .22s ease;display:flex;flex-direction:column;}
  .panel.open{transform:translateX(0);}
  .panel-head{display:flex;align-items:center;gap:10px;padding:16px 18px;border-bottom:1px solid var(--line);}
  .panel-head h2{font-size:16px;flex:1;}
  .panel-close{border:none;background:transparent;font-size:20px;color:var(--ink-dim);cursor:pointer;line-height:1;}
  .panel-body{overflow-y:auto;padding:16px 18px 90px;flex:1;}
  .panel-foot{position:sticky;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:12px 18px;display:flex;gap:10px;justify-content:space-between;align-items:center;}
  .field{display:flex;flex-direction:column;gap:4px;margin-bottom:14px;}
  .field label{font-size:11.5px;color:var(--ink-dim);font-weight:500;}
  .field input,.field select,.field textarea{width:100%;}
  .field textarea{resize:vertical;min-height:70px;font-family:inherit;}

  /* ---------- login ---------- */
  .modal{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;}
  .modal-scrim{position:absolute;inset:0;background:rgba(20,16,10,.38);}
  .modal-card{position:relative;background:var(--surface);border-radius:12px;box-shadow:var(--shadow);width:min(460px,92vw);max-height:84vh;overflow-y:auto;padding:20px 22px;}
  .modal-card h2{font-size:16px;margin-bottom:14px;}
  #loginOverlay .modal-card{width:min(360px,92vw);}
  #loginOverlay .brand{justify-content:center;margin-bottom:18px;}
  #loginOverlay .brand-mark{width:34px;height:34px;}
  #loginOverlay .brand h1{font-size:19px;}
  #loginError{font-size:12.5px;color:var(--bad);margin:-4px 0 10px;}

  .toast{position:fixed;bottom:18px;right:18px;background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:8px;font-size:12.5px;z-index:60;box-shadow:var(--shadow);}
  .toast.bad{background:var(--bad);color:#fff;}

  [hidden]{display:none!important;}

  @media (max-width:640px){
    .author{display:none;}
    .panel{width:100%;}
  }
</style>
</head>
<body>

<div id="loginOverlay" class="modal">
  <div class="modal-scrim"></div>
  <div class="modal-card">
    <div class="brand"><img class="brand-mark" src="corksupply-icon.svg" alt="Cork Supply"><h1>Planeamento Produção CSP4</h1></div>
    <form id="loginForm">
      <div class="field"><label for="li_email">E-mail</label><input id="li_email" type="email" required autocomplete="username"></div>
      <div class="field"><label for="li_pass">Palavra-passe</label><input id="li_pass" type="password" required autocomplete="current-password"></div>
      <p id="loginError" hidden></p>
      <button class="btn primary" type="submit" style="width:100%;justify-content:center;text-align:center;">Entrar</button>
    </form>
  </div>
</div>

<div class="app">
  <div class="topbar">
    <div class="topbar-row">
      <div class="brand"><img class="brand-mark" src="corksupply-icon.svg" alt="Cork Supply" width="26" height="26"><h1>Planeamento Produção CSP4</h1></div>
      <nav class="dept-tabs" id="deptTabs"></nav>
      <input id="searchInput" type="search" placeholder="Procurar…">
      <div class="spacer"></div>
      <div class="author"><label>Eu: <input id="authorInput" placeholder="o seu nome"></label></div>
      <button class="btn small" id="signOutBtn" title="Terminar sessão">Sair</button>
      <button class="btn primary" id="newOrderBtn">+ Nova encomenda</button>
    </div>
  </div>

  <div id="dbBanner" class="banner" hidden></div>

  <main id="boardContainer" class="board-grid"></main>
</div>

<div id="scrim" class="scrim" hidden></div>
<aside id="editPanel" class="panel">
  <div class="panel-head">
    <h2 id="panelTitle">Nova encomenda</h2>
    <button class="panel-close" id="panelClose">&times;</button>
  </div>
  <div class="panel-body">
    <form id="orderForm">
      <div id="formFields"></div>
    </form>
  </div>
  <div class="panel-foot">
    <button class="btn danger" id="deleteOrderBtn" type="button" hidden>Eliminar</button>
    <div style="flex:1"></div>
    <button class="btn" id="cancelOrderBtn" type="button">Cancelar</button>
    <button class="btn primary" id="saveOrderBtn" type="button">Guardar</button>
  </div>
</aside>

<div id="toast" class="toast" hidden></div>

<!-- Firebase (compat build — same API shape used below, no build step needed) -->
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyB95I9RIH8hJ63W1gyu3Mdt_K7Qvx4_7dE",
    authDomain: "planeamento-csp4.firebaseapp.com",
    projectId: "planeamento-csp4",
    storageBucket: "planeamento-csp4.firebasestorage.app",
    messagingSenderId: "1064313855686",
    appId: "1:1064313855686:web:b0a92c7ecde25bcab341c7"
  };
</script>

<script>
(function(){
  "use strict";

  // ---- departamentos fixos ----
  const DEPARTAMENTOS = [
    { id:'retificacao', nome:'Retificação' },
    { id:'lavacao', nome:'Lavação' },
    { id:'escolha', nome:'Escolha' },
    { id:'talis', nome:'Talis' },
    { id:'outros_processos', nome:'Outros Processos' },
    { id:'logistica_expedicao', nome:'Logística e Expedição' },
  ];

  // ---- campos por departamento (por agora só Retificação está definido) ----
  const CAMPOS_POR_DEPARTAMENTO = {
    retificacao: [
      { key:'cliente', label:'Cliente', type:'text' },
      { key:'ordemProducao', label:'Ordem de Produção', type:'text' },
      { key:'material', label:'Material', type:'text' },
      { key:'textoMaterial', label:'Texto do Material', type:'text' },
      { key:'quantidadeRequerida', label:'Quantidade requerida', type:'number' },
      { key:'dataRequerida', label:'Data requerida', type:'date' },
      { key:'observacoes', label:'Observações', type:'textarea' },
    ],
  };

  let db = null;
  let dbMode = 'checking'; // checking | live | offline
  let subscribed = false;
  let ordersById = new Map();
  let currentDept = DEPARTAMENTOS[0].id;
  let editingId = null;

  function esc(s){
    return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
  function fmtNum(n){
    if(n == null || n === '' || isNaN(n)) return '—';
    const neg = n < 0;
    const digits = Math.round(Math.abs(n)).toString();
    let out = '';
    for(let i = 0; i < digits.length; i++){
      const posFromEnd = digits.length - i;
      out += digits[i];
      if(posFromEnd > 1 && posFromEnd % 3 === 1) out += '.';
    }
    return (neg?'-':'') + out;
  }
  function fmtDate(s){
    if(!s) return '—';
    const p = s.split('-'); if(p.length!==3) return s;
    return p[2]+'/'+p[1]+'/'+p[0];
  }
  function fmtFieldValue(v, type){
    if(v == null || v === '') return '';
    if(type === 'date') return fmtDate(v);
    if(type === 'number') return fmtNum(v);
    return String(v);
  }
  function uid(){ return 'l' + Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
  function nowISO(){ return new Date().toISOString(); }
  function authorName(){
    try { return localStorage.getItem('csp4_fluxo_autor') || ''; } catch(e){ return ''; }
  }
  function deptName(id){ const d = DEPARTAMENTOS.find(function(x){ return x.id===id; }); return d ? d.nome : id; }

  function toast(msg, bad){
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.toggle('bad', !!bad);
    el.hidden = false;
    clearTimeout(toast._t);
    toast._t = setTimeout(()=>{ el.hidden = true; }, 3200);
  }

  /* ---------------- auth ---------------- */

  function showLogin(){ document.getElementById('loginOverlay').hidden = false; }
  function hideLogin(){ document.getElementById('loginOverlay').hidden = true; }

  function startAuth(){
    try{
      firebase.initializeApp(firebaseConfig);
    }catch(e){
      dbMode = 'offline';
      showBanner('Não foi possível ligar ao Firebase (configuração em falta ou inválida).');
      render();
      return;
    }
    const auth = firebase.auth();
    auth.onAuthStateChanged(function(user){
      if(!user){
        dbMode = 'checking';
        showLogin();
        return;
      }
      hideLogin();
      db = firebase.firestore();
      dbMode = 'live';
      const authorInput = document.getElementById('authorInput');
      if(!authorName() && user.email) authorInput.value = user.email.split('@')[0];
      if(!subscribed){
        subscribed = true;
        subscribeData();
      }
    });

    document.getElementById('loginForm').addEventListener('submit', function(e){
      e.preventDefault();
      const email = document.getElementById('li_email').value.trim();
      const pass = document.getElementById('li_pass').value;
      const errEl = document.getElementById('loginError');
      errEl.hidden = true;
      auth.signInWithEmailAndPassword(email, pass).catch(function(){
        errEl.textContent = 'Não foi possível iniciar sessão. Verifique o e-mail e a palavra-passe.';
        errEl.hidden = false;
      });
    });

    document.getElementById('signOutBtn').addEventListener('click', function(){
      auth.signOut();
    });
  }

  /* ---------------- persistence layer ---------------- */

  function subscribeData(){
    db.collection('orders').onSnapshot(function(snap){
      const m = new Map();
      snap.docs.forEach(function(d){ m.set(d.id, Object.assign({_id:d.id}, d.data())); });
      ordersById = m;
      render();
    }, function(err){ console.error('orders', err); toast('Erro a sincronizar encomendas.', true); });
  }

  function showBanner(msg){
    const b = document.getElementById('dbBanner');
    b.textContent = msg;
    b.hidden = false;
  }

  async function persistOrder(id, patch){
    const author = authorName() || 'anónimo';
    if(dbMode === 'live' && db){
      try{
        if(id){
          await db.collection('orders').doc(id).update(Object.assign({}, patch, { atualizadoPor: author, atualizadoEm: nowISO() }));
        } else {
          await db.collection('orders').add(Object.assign({}, patch, { criadoPor: author, atualizadoPor: author, criadoEm: nowISO(), atualizadoEm: nowISO() }));
        }
        toast('Encomenda guardada.');
      }catch(e){ toast('Erro ao guardar encomenda.', true); }
    } else {
      if(id){
        const existing = ordersById.get(id) || {};
        ordersById.set(id, Object.assign({}, existing, patch, {_id:id, atualizadoPor:author, atualizadoEm:nowISO()}));
      } else {
        const nid = uid();
        ordersById.set(nid, Object.assign({_id:nid}, patch, {criadoPor:author, atualizadoPor:author, criadoEm:nowISO(), atualizadoEm:nowISO()}));
      }
      toast('Guardado localmente (pré-visualização).');
      render();
    }
  }

  async function removeOrder(id){
    if(dbMode === 'live' && db){
      try{ await db.collection('orders').doc(id).delete(); toast('Encomenda eliminada.'); }
      catch(e){ toast('Erro ao eliminar.', true); }
    } else {
      ordersById.delete(id);
      toast('Eliminado localmente (pré-visualização).');
      render();
    }
  }

  /* ---------------- render ---------------- */

  function renderDeptTabs(){
    const nav = document.getElementById('deptTabs');
    nav.innerHTML = DEPARTAMENTOS.map(function(d){
      return '<button class="dept-tab'+(d.id===currentDept?' active':'')+'" data-dept="'+esc(d.id)+'">'+esc(d.nome)+'</button>';
    }).join('');
    nav.querySelectorAll('[data-dept]').forEach(function(btn){
      btn.addEventListener('click', function(){
        currentDept = btn.getAttribute('data-dept');
        renderDeptTabs();
        render();
      });
    });
  }

  function cardHtml(o, campos){
    const title = campos[0];
    const subtitle = campos[1];
    let html = '<div class="card" data-id="'+esc(o._id)+'">';
    html += '<div class="card-title">'+esc(fmtFieldValue(o[title.key], title.type) || ('(sem '+title.label.toLowerCase()+')'))+'</div>';
    if(subtitle){
      const subVal = fmtFieldValue(o[subtitle.key], subtitle.type);
      if(subVal) html += '<div class="card-sub">'+esc(subVal)+'</div>';
    }
    const rows = campos.slice(2).map(function(c){
      const v = fmtFieldValue(o[c.key], c.type);
      if(!v) return '';
      return '<div class="card-row"><span class="card-row-label">'+esc(c.label)+'</span><span class="card-row-value" title="'+esc(v)+'">'+esc(v)+'</span></div>';
    }).join('');
    if(rows) html += '<div class="card-rows">'+rows+'</div>';
    html += '</div>';
    return html;
  }

  function render(){
    renderDeptTabs();
    const container = document.getElementById('boardContainer');
    const campos = CAMPOS_POR_DEPARTAMENTO[currentDept];
    document.getElementById('newOrderBtn').hidden = !campos;
    if(!campos){
      container.innerHTML = '<div class="board-empty">O separador "'+esc(deptName(currentDept))+'" ainda não foi configurado.<br>Diga quais os campos que quer aqui e configuramos a seguir.</div>';
      return;
    }
    const q = (document.getElementById('searchInput').value || '').trim().toLowerCase();
    let list = [...ordersById.values()].filter(function(o){ return o.departamentoId === currentDept; });
    if(q){
      list = list.filter(function(o){
        const hay = campos.map(function(c){ return o[c.key]; }).join(' ').toLowerCase();
        return hay.indexOf(q) !== -1;
      });
    }
    list.sort(function(a,b){
      const da = a.dataRequerida || '9999-99-99', db2 = b.dataRequerida || '9999-99-99';
      return da < db2 ? -1 : da > db2 ? 1 : 0;
    });
    container.innerHTML = list.length
      ? list.map(function(o){ return cardHtml(o, campos); }).join('')
      : '<div class="board-empty">Sem encomendas em '+esc(deptName(currentDept))+'.</div>';
    container.querySelectorAll('.card').forEach(function(el){
      el.addEventListener('click', function(){ openEditor(el.getAttribute('data-id')); });
    });
  }

  /* ---------------- editor panel ---------------- */

  function renderOrderForm(campos, o){
    const wrap = document.getElementById('formFields');
    wrap.innerHTML = campos.map(function(c){
      const val = o && o[c.key] != null ? o[c.key] : '';
      if(c.type === 'textarea'){
        return '<div class="field"><label for="f_dyn_'+c.key+'">'+esc(c.label)+'</label><textarea id="f_dyn_'+c.key+'">'+esc(val)+'</textarea></div>';
      }
      const inputType = c.type === 'number' ? 'number' : (c.type === 'date' ? 'date' : 'text');
      const extra = c.type === 'number' ? ' min="0" step="1"' : '';
      return '<div class="field"><label for="f_dyn_'+c.key+'">'+esc(c.label)+'</label><input id="f_dyn_'+c.key+'" type="'+inputType+'" value="'+esc(val)+'"'+extra+'></div>';
    }).join('');
  }

  function openEditor(id){
    const campos = CAMPOS_POR_DEPARTAMENTO[currentDept];
    if(!campos) return;
    editingId = id;
    const o = id ? ordersById.get(id) : null;
    document.getElementById('panelTitle').textContent = o ? 'Editar encomenda' : 'Nova encomenda';
    document.getElementById('deleteOrderBtn').hidden = !o;
    renderOrderForm(campos, o);
    document.getElementById('editPanel').classList.add('open');
    document.getElementById('scrim').hidden = false;
  }

  function closeEditor(){
    document.getElementById('editPanel').classList.remove('open');
    document.getElementById('scrim').hidden = true;
    editingId = null;
  }

  function collectForm(){
    const campos = CAMPOS_POR_DEPARTAMENTO[currentDept] || [];
    const data = { departamentoId: currentDept };
    campos.forEach(function(c){
      const el = document.getElementById('f_dyn_'+c.key);
      if(!el) return;
      let v = el.value;
      if(c.type === 'number') v = v === '' ? null : Number(v);
      else if(c.type === 'date') v = v || null;
      else v = v.trim();
      data[c.key] = v;
    });
    return data;
  }

  /* ---------------- wiring ---------------- */

  document.getElementById('searchInput').addEventListener('input', render);
  document.getElementById('newOrderBtn').addEventListener('click', function(){ openEditor(null); });
  document.getElementById('panelClose').addEventListener('click', closeEditor);
  document.getElementById('cancelOrderBtn').addEventListener('click', closeEditor);
  document.getElementById('scrim').addEventListener('click', closeEditor);

  document.getElementById('saveOrderBtn').addEventListener('click', function(){
    const data = collectForm();
    const campos = CAMPOS_POR_DEPARTAMENTO[currentDept] || [];
    const primary = campos[0];
    if(primary && !data[primary.key]){
      toast('Preencha pelo menos o campo "'+primary.label+'".', true);
      return;
    }
    persistOrder(editingId, data);
    closeEditor();
  });
  document.getElementById('deleteOrderBtn').addEventListener('click', function(){
    if(editingId && confirm('Eliminar esta encomenda?')){
      removeOrder(editingId);
      closeEditor();
    }
  });

  const authorInput = document.getElementById('authorInput');
  authorInput.value = authorName();
  authorInput.addEventListener('change', function(e){
    try{ localStorage.setItem('csp4_fluxo_autor', e.target.value.trim()); }catch(err){}
  });

  render();
  startAuth();
})();
</script>
</body>
</html>
